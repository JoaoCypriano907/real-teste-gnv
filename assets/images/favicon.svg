<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE043"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E242C"/>
      <stop offset="100%" stop-color="#0A0C0E"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <polygon points="32,2 58,15 58,49 32,62 6,49 6,15" fill="url(#favDark)" stroke="#333D4B" stroke-width="2"/>
  <polygon points="32,6 54,17 54,47 32,58 10,47 10,17" fill="none" stroke="url(#favYellow)" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Cylinder Graphic -->
  <rect x="29" y="14" width="6" height="4" rx="1" fill="#FFFFFF"/>
  <rect x="27" y="18" width="10" height="2" rx="1" fill="#F5B800"/>
  <rect x="24" y="21" width="16" height="26" rx="5" fill="#FFFFFF"/>
  <rect x="26" y="23" width="12" height="22" rx="3" fill="#0A0C0E"/>
  
  <!-- GNV text inside -->
  <text x="32" y="38" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#F5B800" text-anchor="middle">GNV</text>
  
  <!-- Precision needle -->
  <circle cx="32" cy="28" r="2.5" fill="#F5B800"/>
</svg>